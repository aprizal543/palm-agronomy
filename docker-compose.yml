services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: palm
      POSTGRES_USER: palm
      POSTGRES_PASSWORD: palm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palm -d palm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - palm_postgres_data:/var/lib/postgresql/data

volumes:
  palm_postgres_data:

